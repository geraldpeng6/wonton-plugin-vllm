# vLLM 0.32 的 OpenAI 服务器没有根路由：探针和小程序打开的都是 /，这里跳到接口
# 文档；其余路径（/docs、/v1、/static）原样转发给 vLLM，网关注入的
# Authorization 头随请求一起转发，流式响应不缓冲。
server {
  listen 80;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location = / {
    return 302 /docs;
  }

  location / {
    proxy_pass http://vllm:8000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
  }
}
